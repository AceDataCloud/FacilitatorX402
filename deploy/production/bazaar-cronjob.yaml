apiVersion: batch/v1
kind: CronJob
metadata:
  name: facilitator-bazaar-refresh
  namespace: acedatacloud
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 50
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: facilitator-bazaar-refresh
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: docker-registry
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: ghcr.io/acedatacloud/facilitator-backend:${TAG}
              imagePullPolicy: IfNotPresent
              command: ["python", "manage.py", "refresh_bazaar_catalog"]
              envFrom:
                - secretRef:
                    name: pgsql
              env:
                - name: APP_ENV
                  value: production
                - name: APP_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      key: SECRET_KEY
                      name: app
                      optional: false
                - name: PGSQL_DATABASE_FACILITATOR
                  value: acedatacloud_facilitator
                - name: X402_BAZAAR_ENABLED
                  value: "true"
                - name: X402_BAZAAR_CATALOG_URL
                  value: http://platform-backend:8000/internal/v1/x402/bazaar-resources
                - name: X402_BAZAAR_CATALOG_ACCESS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: CATALOG_ACCESS_TOKEN
                      name: x402
                      optional: false
                - name: X402_BAZAAR_CATALOG_SIGNING_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: CATALOG_SIGNING_SECRET
                      name: x402
                      optional: false
                - name: X402_BAZAAR_RESOURCE_ORIGIN
                  value: https://x402.acedata.cloud
                - name: X402_BASE_EXACT_ENABLED
                  value: "true"
                - name: X402_BASE_UPTO_ENABLED
                  value: "true"
                - name: X402_BASE_SIGNER_ADDRESS
                  valueFrom:
                    secretKeyRef:
                      key: BASE_SIGNER_ADDRESS
                      name: x402
                      optional: false
                - name: X402_SOLANA_MAINNET_ENABLED
                  value: "true"
                - name: X402_SOLANA_SIGNER_ADDRESS
                  valueFrom:
                    secretKeyRef:
                      key: SOLANA_SIGNER_ADDRESS
                      name: x402
                      optional: false
                - name: X402_SKALE_EXACT_ENABLED
                  value: "true"
                - name: X402_SKALE_SIGNER_ADDRESS
                  valueFrom:
                    secretKeyRef:
                      key: SKALE_SIGNER_ADDRESS
                      name: x402
                      optional: false
              resources:
                limits:
                  cpu: 200m
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 32Mi
