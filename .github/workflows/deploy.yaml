name: deploy
on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

concurrency:
  group: facilitator-production
  cancel-in-progress: false

env:
  BUILD_NUMBER: ${{ github.run_id }}-${{ github.run_attempt }}

permissions:
  contents: read
  packages: write

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: docker compose build

      - name: Push Docker images
        run: docker compose push

      - name: Set Kubectl (US SV cluster)
        uses: Azure/k8s-set-context@v5
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_SV }}

      - name: Release with payment safety gates
        run: bash ./deploy/release.sh
