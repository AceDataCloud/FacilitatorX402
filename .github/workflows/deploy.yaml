name: deploy
on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

concurrency:
  group: facilitator-production
  cancel-in-progress: false
  queue: max

env:
  BUILD_NUMBER: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: docker compose build

      - name: Push Docker images
        env:
          COMPOSE_HTTP_TIMEOUT: "600"
        run: docker compose push

      - name: Set Kubectl (Hong Kong)
        uses: Azure/k8s-set-context@v5
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_HK }}

      - name: Select release context
        run: echo "KUBE_CONTEXT=$(kubectl config current-context)" >> "$GITHUB_ENV"

      - name: Deploy restored Base and Solana payments
        env:
          FACILITATOR_RELEASE_MODE: restore
          CONFIRM_FACILITATOR_PAYMENT_RESTORE: "yes"
          FACILITATOR_RESTORE_RAILS: base-exact,base-upto,solana-exact
        run: bash ./deploy/release.sh
