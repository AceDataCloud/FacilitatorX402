name: deploy
on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

concurrency:
  group: facilitator-production
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test IP Address
        run: |
          wget -qO- https://ipecho.net/plain ; echo

      - name: Generate Build Number
        uses: einaregilsson/build-number@v2
        with:
          token: ${{ secrets.github_token }}
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: "true"

      - name: Get Build Number
        run: echo "$BUILD_NUMBER"

      - name: Build Docker images
        run: docker compose build

      - name: Push Docker images
        env:
          COMPOSE_HTTP_TIMEOUT: "600"
        run: docker compose push

      - name: Set Kubectl (Hong Kong)
        uses: Azure/k8s-set-context@v5
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_HK }}

      - name: Test Kubectl
        run: |
          kubectl get deployment/facilitator-backend -n acedatacloud
          kubectl get service/facilitator-backend -n acedatacloud

      - name: Stage release with payments paused
        env:
          FACILITATOR_RELEASE_MODE: paused
        run: bash ./deploy/release.sh
